<!DOCTYPE html>
<html lang="en" data-bs-theme="kazwire">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Game</title>
  <link rel="stylesheet" href="/themes.css">
</head>
<body>
<div id="loginStatus"></div>

<header>
  <img src="/logo_navbar.png" alt="Logo">
  <nav>
    <a href="/">Home</a>
    <a href="/games">Games</a>
    <a href="/feedback">Feedback</a>
  </nav>
</header>

<div class="container">
  <div class="game-box">
    <iframe id="gameframe" allowfullscreen sandbox="allow-scripts allow-same-origin"></iframe>
    <div class="game-title" id="gameTitle"></div>
    <div class="game-author" id="gameAuthor"></div>
    <a class="close-btn" onclick="closeGame()">X</a>
    <a class="full-btn" onclick="toggleFullscreen(document.getElementById('gameframe'))"></a>
  </div>
  
  <div class="ads" id="adsArea"></div>
</div>

<script src="/ads/ads.js"></script>

<script>
/* ================= GAME DATA ================= */
const games = {
  1: "FNaF 1",
  2: "FNaF 2",
  3: "FNaF 3",
  4: "FNaF 4",
};

const authors = {
  1: "Scott Cawthon",
  2: "Scott Cawthon",
  3: "Scott Cawthon",
  4: "Scott Cawthon",
};

// get ?id from URL
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

let title = games[id];
let author = authors[id];

if (!title) {
  title = "Invalid";
  author = "pwR";
  document.getElementById("gameframe").src = "/frame/game/closed";
} else {
  // make the src: lowercase, remove spaces and apostrophes/punctuation
  const cleanSrc = title.toLowerCase().replace(/[^a-z0-9]/g,'');
  document.getElementById("gameframe").src = `/frame/game/${cleanSrc}/`;
}

// set titles and author
document.getElementById("pageTitle").textContent = title;
document.getElementById("gameTitle").textContent = title;
document.getElementById("gameAuthor").textContent = `By ${author}`;

/* ================= FULLSCREEN ================= */
function toggleFullscreen(elem) {
  if (!document.fullscreenElement) elem.requestFullscreen();
  else document.exitFullscreen();

  document.addEventListener("fullscreenchange", () => {
    elem.style.borderRadius = document.fullscreenElement ? "0" : "10px";
  });
}

/* ================= CLOSE ================= */
function closeGame() {
  document.getElementById("gameframe").src = "/frame/game/closed";
}

/* ================= ADS ================= */
const adsArea = document.getElementById('adsArea');
let adIndex = 0;

function rotateAd() {
  if (!ads || ads.length === 0) return;

  const ad = ads[adIndex];
  adsArea.innerHTML = '';

  const slot = document.createElement('div');
  slot.className = 'ad-slot';

  const img = document.createElement('img');
  img.src = ad.img;

  if (ad.href) {
    const link = document.createElement('a');
    link.href = ad.href;
    link.appendChild(img);
    slot.appendChild(link);
  } else {
    slot.appendChild(img);
  }

  adsArea.appendChild(slot);
  adIndex = (adIndex + 1) % ads.length;
}

rotateAd();
setInterval(rotateAd, 10000);
</script>

<script type="module" defer src="/creds.js"></script>
</body>
</html>
