<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaming Reimagined</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #121212;
    color: #fff;
    text-align: center;
    padding: 50px 20px;
  }
  .logo-header img {
    width: 400px;
    height: auto;
    margin-bottom: 40px;
  }
  .topbar {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 50px;
  }
  .topbar a {
    text-decoration: none;
    padding: 12px 25px;
    background-color: #ffcc00;
    color: #000;
    font-weight: bold;
    border-radius: 10px;
    transition: background 0.3s;
  }
  .topbar a:hover {
    background-color: #ffaa00;
  }
  .credits-section {
    font-size: 1.2em;
    margin-bottom: 50px;
  }
  .credits-section h2 {
    font-size: 2em;
    margin-bottom: 20px;
  }
  .credit {
    margin: 15px 0;
  }
  .footer-logo {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 200px;
    height: auto;
    z-index: 9998;
    padding: 10px;
  }
  .feedback-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #222;
    color: #fff;
    padding: 10px 15px;
    border-radius: 20px;
    text-decoration: none;
    font-size: 14px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    z-index: 9999;
  }
</style>
</head>
<body>

<div class="logo-header">
  <img src="/logo_homepage.png" alt="Gaming Reimagined Logo">
</div>

<div class="credits-section">
  <h2>Credits</h2>
  <div class="credit"><strong>pwR</strong> - Main designer and programmer of Gaming Reimagined</div>
  <div class="credit"><strong>Unixityyy</strong> - Co-Owner</div>
</div>

<img src="/logo_light.png" class="footer-logo">

</body>
</html>
