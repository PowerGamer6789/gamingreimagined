<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Reimagined - Farewell</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            text-align: center;
            padding: 80px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .logo-header img {
            width: 400px;
            max-width: 90%;
            height: auto;
            margin-bottom: 40px;
        }
        h1 {
            color: #ffcc00;
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.3em;
            max-width: 600px;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        .action-btn {
            text-decoration: none;
            padding: 15px 40px;
            background-color: #ffcc00;
            color: #000;
            font-weight: bold;
            border-radius: 10px;
            font-size: 1.2em;
            transition: transform 0.3s, background-color 0.3s;
        }
        .action-btn:hover {
            background-color: #ffaa00;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="logo-header">
        <img src="/logo_homepage.png" alt="Gaming Reimagined Logo">
    </div>

    <h1>All good things must come to an end.</h1>

    <p>Gaming Reimagined is officially shutting down. It was fun while it lasted.</p>

    <a href="/whatnow" class="action-btn">What now?</a>

</body>
</html>
