<!DOCTYPE html>
<html lang="en" data-bs-theme="kazwire">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Manager</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/themes.css">
<style>
body, html {
  margin:0; padding:0; height:100%;
  font-family: Arial, sans-serif;
  background-color:#121212;
  color:#fff;
}

header {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 24px;
  background:#181818;
}
header img { height:40px; }
header nav a { color:#fff; text-decoration:none; margin-left:16px; font-weight:bold; }

.container {
  height: calc(100vh - 64px);
  display: flex; justify-content:center; align-items:flex-start;
}

.card {
  background:#181818;
  border-radius:0;
  width:100%;
  height:100%;
  padding:40px;
  display:flex;
  flex-direction:column;
  gap:30px;
  box-sizing:border-box;
}

.row {
  display:flex;
  align-items:center;
  gap:12px;
}

.row label {
  width:140px;
  font-weight:bold;
}

.row input[type=text] {
  flex:1;
  padding:10px;
  border-radius:6px;
  border:1px solid #333;
  background:#121212;
  color:#fff;
}

button {
  cursor:pointer;
  border-radius:6px;
  padding:10px 16px;
  font-weight:bold;
  border:none;
}

.btn-primary { background:#ffcc00; color:#000; }
.btn-secondary { background:#222; color:#ffcc00; border:1px solid #ffcc00; padding:6px 12px; font-weight:normal; }
.btn-danger { background:#181818; color:#ff4d4d; border:2px solid #ff4d4d; }

.actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:12px; }

/* Feedback messages */
.feedback {
  font-size:13px;
  color:#0f0;
  margin-left:140px;
}
.feedback.error { color:#ff4d4d; }

/* Modals */
.modal {
  position:fixed; inset:0;
  background: rgba(0,0,0,0.65);
  display:flex; align-items:center; justify-content:center;
  z-index:9999;
}
.modal.hidden { display:none; }
.modal-box {
  background:#121212;
  padding:22px;
  border-radius:14px;
  max-width:400px;
  text-align:center;
}
.modal-actions { margin-top:18px; display:flex; justify-content:center; gap:10px; }

.mono { font-family: monospace; font-size:13px; }
</style>
</head>

<body>
<div id="loginStatus"></div>

<header>
  <img src="/logo_navbar.png" alt="Logo">
  <nav>
    <a href="/">Home</a>
    <a href="/games">Games</a>
    <a href="/credits">Credits</a>
  </nav>
</header>

<div class="container">
  <div class="card">
    <h2>Account Manager</h2>

    <!-- Username -->
    <div class="row">
      <label for="nameInput">Username</label>
      <input id="nameInput" type="text" placeholder="Enter username">
      <button id="saveNameBtn" class="btn-primary">Update username</button>
    </div>
    <div id="usernameFeedback" class="feedback"></div>

    <!-- Gaming Reimagined ID -->
    <div class="row">
      <label>Gaming Reimagined ID</label>
      <span id="maskedUid" class="mono">Loading…</span>
      <button id="copyUidBtn" class="btn-secondary">Copy</button>
    </div>
    <div id="copyFeedback" class="feedback"></div>

    <!-- Actions -->
    <div class="actions">
      <button id="logoutBtn" class="btn-primary">Log out</button>
      <button id="deleteBtn" class="btn-danger">Delete account</button>
    </div>
    <div id="actionFeedback" class="feedback"></div>
  </div>
</div>

<!-- Copy ID Modal -->
<div id="idModal" class="modal hidden">
  <div class="modal-box">
    <h3>Do not share this ID</h3>
    <p>This ID uniquely identifies your account.<br>Sharing it can put your account at risk.</p>
    <div class="modal-actions">
      <button id="cancelCopy" class="btn-secondary">Cancel</button>
      <button id="confirmCopy" class="btn-danger">I Understand</button>
    </div>
  </div>
</div>

<!-- Delete Account Modal -->
<div id="deleteModal" class="modal hidden">
  <div class="modal-box">
    <h3>Delete account?</h3>
    <p>This is permanent.<br>Your account and data will be erased.</p>
    <div class="modal-actions">
      <button id="cancelDelete" class="btn-secondary">Cancel</button>
      <button id="confirmDelete" class="btn-danger">Delete</button>
    </div>
  </div>
</div>

<script type="module" src="/creds.js"></script>
<script type="module">
import { onAuthStateChanged, signOut, updateProfile, updateEmail, deleteUser } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";
import { auth } from "/creds.js";

const nameInput = document.getElementById("nameInput");
const saveBtn = document.getElementById("saveNameBtn");
const maskedUidEl = document.getElementById("maskedUid");
const copyBtn = document.getElementById("copyUidBtn");
const logoutBtn = document.getElementById("logoutBtn");
const deleteBtn = document.getElementById("deleteBtn");

const usernameFeedback = document.getElementById("usernameFeedback");
const copyFeedback = document.getElementById("copyFeedback");
const actionFeedback = document.getElementById("actionFeedback");

const idModal = document.getElementById("idModal");
const cancelCopy = document.getElementById("cancelCopy");
const confirmCopy = document.getElementById("confirmCopy");
const deleteModal = document.getElementById("deleteModal");
const cancelDelete = document.getElementById("cancelDelete");
const confirmDelete = document.getElementById("confirmDelete");

let fullUid = "";

onAuthStateChanged(auth, (user) => {
  if(!user) location.href = "/login?afterLogin=/account";

  const currentName = user.displayName || (user.email ? user.email.split("@")[0] : "user");
  nameInput.value = currentName;
  fullUid = user.uid;
  maskedUidEl.textContent = fullUid.slice(0,3) + "*".repeat(fullUid.length-3);
});

// Update username + email
saveBtn.onclick = async () => {
  const user = auth.currentUser;
  if(!user) return;

  const newName = nameInput.value.trim();
  if(!newName) {
    usernameFeedback.textContent = "Username cannot be empty";
    usernameFeedback.classList.add("error");
    return;
  }

  try {
    await updateProfile(user, { displayName: newName });
    await updateEmail(user, `${newName}@team.pwr`);
    usernameFeedback.textContent = "Username updated successfully!";
    usernameFeedback.classList.remove("error");
    window.location.reload
  } catch (e) {
    usernameFeedback.textContent = `Error: ${e.message}`;
    usernameFeedback.classList.add("error");
  }
};

// Copy GR ID
copyBtn.onclick = () => idModal.classList.remove("hidden");
cancelCopy.onclick = () => idModal.classList.add("hidden");
confirmCopy.onclick = async () => {
  try {
    await navigator.clipboard.writeText(fullUid);
    idModal.classList.add("hidden");
    copyFeedback.textContent = "Copied to clipboard!";
  } catch {
    copyFeedback.textContent = "Failed to copy!";
  }
  setTimeout(()=>copyFeedback.textContent="",1500);
};

// Logout
logoutBtn.onclick = () => signOut(auth).then(()=>actionFeedback.textContent="Logged out successfully!");

// Delete account
deleteBtn.onclick = () => deleteModal.classList.remove("hidden");
cancelDelete.onclick = () => deleteModal.classList.add("hidden");
confirmDelete.onclick = async () => {
  const user = auth.currentUser;
  if(!user) return;
  try {
    await deleteUser(user);
    deleteModal.classList.add("hidden");
    actionFeedback.textContent = "Account deleted successfully!";
    setTimeout(()=>location.href="/",1500);
  } catch(e) {
    actionFeedback.textContent = `Error: ${e.message}`;
  }
};
</script>
</body>
</html>
