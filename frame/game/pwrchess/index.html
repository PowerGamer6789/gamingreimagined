<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pwRChess</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div id="splash">
        <img src="./splash.png" alt="pwRChess" class="splash-logo">
    </div>

    <div id="main-menu" class="hidden">
        <h1 class="title">pwRChess</h1>
        <div class="menu-container">
            <button id="play-btn">PLAY VS BOT</button>
            <button id="p2-btn">2 PLAYER LOCAL</button>
        </div>
    </div>

    <div id="popup-overlay" class="hidden">
        <div class="popup">
            <h3>Difficulty</h3>
            <button class="diff-opt" data-depth="1">EASY</button>
            <button class="diff-opt" data-depth="2">NORMAL</button>
            <button class="diff-opt" data-depth="3">HARD</button>
            <button class="diff-opt" data-depth="4">IMPOSSIBLE</button>
            <button class="cancel-btn" onclick="closePopup()">CANCEL</button>
        </div>
    </div>

    <div id="game-view" class="hidden">
        <div id="winner-overlay" class="hidden">
            <div class="winner-content">
                <h1 id="winner-text">WHITE WINS!</h1>
                <div class="winner-btns">
                    <button onclick="initGame()">REMATCH</button>
                    <button class="secondary-btn" onclick="resetToMenu()">EXIT</button>
                </div>
            </div>
        </div>

        <div class="game-layout">
            <div id="captured-white" class="graveyard" title="White's losses"></div>
            
            <div id="board-container">
                <div id="board"></div>
            </div>

            <div id="sidebar">
                <div id="status">White's Turn</div>
                <div id="move-log">
                    <div class="log-header">ACTION LOG</div>
                    <div id="log-content"></div>
                </div>
                <button class="menu-btn" onclick="resetToMenu()">QUIT TO MENU</button>
            </div>

            <div id="captured-black" class="graveyard" title="Black's losses"></div>
        </div>
    </div>

    <script src="./game.js"></script>
</body>
</html>
