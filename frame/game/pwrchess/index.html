<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pwRChess</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div id="splash">
        <img src="./splash.png" alt="pwRChess" id="splash-img">
    </div>

    <div id="menu" class="hidden">
        <div class="hero">
            <h1 class="pwr-title">pwRChess</h1>
            <button class="btn-pwr" onclick="openModal()">Start Game</button>
        </div>
    </div>

    <div id="game" class="hidden">
        <header class="navbar">
            <div class="nav-left">
                <span class="brand">pwRChess</span>
                <span id="bot-lvl" class="tag">NORMAL</span>
            </div>
            <div id="turn-badge" class="status-msg">White to move</div>
            <div class="nav-right">
                <span id="user-name" class="user-tag">Guest</span>
            </div>
        </header>

        <main class="game-area">
            <div class="board-container">
                <div id="cap-w" class="dock"></div>
                <div id="board"></div>
                <div id="cap-b" class="dock"></div>
            </div>
            
            <aside class="sidebar">
                <div class="panel">
                    <h3>Move Log</h3>
                    <div id="history"></div>
                </div>
                <button class="btn-danger" onclick="location.reload()">Resign</button>
            </aside>
        </main>
    </div>

    <div id="modal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2>Difficulty</h2>
            <div class="modal-options">
                <button class="btn-opt" onclick="startGame(1, 'Easy')">Easy</button>
                <button class="btn-opt" onclick="startGame(2, 'Normal')">Normal</button>
                <button class="btn-opt" onclick="startGame(3, 'Hard')">Hard</button>
            </div>
            <button class="btn-link" onclick="closeModal()">Back to Menu</button>
        </div>
    </div>

    <script type="module" src="./script.js"></script>
</body>
</html>
