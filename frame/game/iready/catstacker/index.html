<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>cat stacker</title>
  
  <style type="text/css">
    /* 1. Ensure the html and body take up the full viewport */
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #000000; /* Black background */
      overflow: hidden; /* Prevents accidental scrolling */
    }

    /* 2. Make the game container fill the screen and center content */
    #gameContainer {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000000;
    }

    /* 3. Update the loader holder to be black instead of lightgrey */
    #fullWindowHolder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10; /* Ensure it stays on top */
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .loaderContainer {
      text-align: center;
    }

    .loadingLabel {
      color: white;
      font-family: 'balooregular', sans-serif;
      margin-top: 20px;
    }

    /* Existing Loader Animation */
    .loader,
    .loader:after {
      border-radius: 50%;
      width: 10em;
      height: 10em;
    }
    .loader {
      margin: 0 auto;
      font-size: 10px;
      position: relative;
      text-indent: -9999em;
      border-top: 1.1em solid rgba(32, 206, 247, 0.2);
      border-right: 1.1em solid rgba(32, 206, 247, 0.2);
      border-bottom: 1.1em solid rgba(32, 206, 247, 0.2);
      border-left: 1.1em solid #20cef7;
      transform: translateZ(0);
      animation: load8 1.1s infinite linear;
    }
    @keyframes load8 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @font-face {
        font-family: 'balooregular';
        src: url('assets/fonts/baloo-regular-webfont.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
    }
  </style>

  <script src="../libs/phaser/phaser-ce-2.16.0.min.js"></script>
  <script type="text/javascript">
    var arrDomain = location.hostname.split('.');
    if (arrDomain.length > 2 && !/amazonaws/.test(location.hostname) && !/(?:[0-9]{1,3}\.){3}[0-9]{1,3}/.test(location.hostname)) {
        arrDomain.shift();
        document.domain = arrDomain.join('.');
    }
    
    var init = window.parent.window.gameBridge ? window.parent.window.gameBridge.initialized : function () {};

    function displayGame() {
      document.getElementById('fullWindowHolder').style.display = 'none';
      // Ensure flex display is maintained when showing
      document.getElementById('gameContainer').style.display = 'flex'; 
      init();
    }
  </script>
</head>

<body>
  <div id="fullWindowHolder">
    <div id="loaderContainer" class="loaderContainer">
      <div class="loader">Loading...</div>
      <div id="loadingLabel" class="loadingLabel"></div>
    </div>
  </div>
  
  <div id="gameContainer"></div>

  <script type="text/javascript" src="manifest.85f4f337e94b40a6c472.js"></script>
  <script type="text/javascript" src="vendor.b45cca953c2bf5d6baa6.js"></script>
  <script type="text/javascript" src="bundle.76986a4845f50924f7de.js"></script>
</body>
</html>
