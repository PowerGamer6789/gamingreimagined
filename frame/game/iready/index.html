<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The i-Ready Collection | Gaming Reimagined</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(1200px 600px at top, #1f1f1f, #0a0a0a);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card {
      width: 100%;
      max-width: 500px;
      padding: 45px;
      background: linear-gradient(
        180deg,
        rgba(30, 30, 30, 0.95),
        rgba(15, 15, 15, 0.95)
      );
      border-radius: 20px;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      text-align: center;
      animation: pop 0.6s ease;
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.95) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .logo {
      width: 280px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0 0 15px;
      font-size: 1.8rem;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 25px;
    }
    /* Button styles matched to your homepage */
    .game-btn {
      text-decoration: none;
      padding: 15px 20px;
      background: #ffcc00;
      color: #000;
      font-weight: bold;
      border-radius: 10px;
      transition: 0.3s;
      display: block;
      font-size: 1.1em;
    }
    .game-btn:hover {
      background-color: #ffaa00;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 204, 0, 0.3);
    }
    .footer-logo {
      position: fixed;
      bottom: 16px;
      left: 16px;
      width: 150px;
      opacity: 0.85;
    }
    .discord-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #222;
      color: #fff;
      padding: 10px 15px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="/logo_homepage.png" alt="Gaming Reimagined" class="logo">
    <h1>The i-Ready Collection</h1>
    <p>More games coming soon<br>Select the game you would like to play:</p>
    
    <div class="game-container">
      <a href="./catstacker" class="game-btn">Cat Stacker</a>
      <a href="./digsite" class="game-btn">Dig Site</a>
    </div>
  </div>

  <img src="/logo_light.png" class="footer-logo">
  <a href="https://discord.gg/ggEaKeemHe" class="discord-btn">Join our Discord</a>

</body>
</html>
