<!DOCTYPE html><html lang="en-us"><head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<script>
  // Save the current console log function in case we need it.
  const _log = console.log;
  const _debug = console.debug;
  const _info = console.info;
  const _warn = console.warn;
  const _error = console.error;
  // Override the console
  console.log = function(...rest) {
    window.parent.postMessage(
      {
        source: 'iframe-' + window.name,
        message: rest,
        method: 'log'
      },
      '*'
    );
    _log.apply(console, arguments);
  };

  console.debug = function(...rest) {
    window.parent.postMessage(
      {
        source: 'iframe-' + window.name,
        message: rest,
        method: 'debug'
      },
      '*'
    );
    _debug.apply(console, arguments);
  };

  console.info = function(...rest) {
    window.parent.postMessage(
      {
        source: 'iframe-' + window.name,
        message: rest,
        method: 'info'
      },
      '*'
    );
    _info.apply(console, arguments);
  };

  console.warn = function(...rest) {
    window.parent.postMessage(
      {
        source: 'iframe-' + window.name,
        message: rest,
        method: 'warn'
      },
      '*'
    );
    _warn.apply(console, arguments);
  };

  console.error = function(...rest) {
    window.parent.postMessage(
      {
        source: 'iframe-' + window.name,
        message: rest,
        method: 'error'
      },
      '*'
    );
    _error.apply(console, arguments);
  };
</script>

    
<script>
    window.onerror = function(msg) {
        window.parent.postMessage(
            {
                source: 'iframe-' + window.name,
                message: [msg],
                method: 'error'
            },
            '*'
            );
    };
</script>

    
<script>
    window.addEventListener('load', (event) => {
    window.parent.postMessage({
        source: 'iframe-navigation-' + window.name,
        message: document.location.href,
    }, '*');
    })
</script>

    
<script>
    window.onload = function() {
        window.parent.postMessage(
            {
              source: 'iframe-' + window.name,
              windowHeight: document.getElementsByTagName('html')[0].getBoundingClientRect().height,
            },
            '*'
          );
    };
</script>

<script src="./gameloader-helper.js"></script>
<meta charset="utf-8">
<script src=""></script>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ragdoll Archers</title>

<link rel="stylesheet" href="./style.css">
</head>
<body>
  
<div id="unity-container" class="unity-desktop">
<canvas id="unity-canvas"></canvas>
</div>
<div id="loading-cover">
<div id="unity-loading-bar">
<div id="unity-logo"><img src="img.png"></div>
<div class="progress-spinner-container">
<div class="spinner-left"><img src="img.png"></div>
<div id="unity-progress-bar-empty">
<div id="unity-progress-bar-full"></div>
</div>
<div class="spinner-right"><img src="img.png"></div>
</div>
</div>
</div>
<script>
    const buildUrl = "Build";
    const loaderUrl = "./unity.js";
const config = {
  dataUrl: "./loader.data.unityweb",
  frameworkUrl: "./framework.js.unityweb",
  codeUrl: "./streaming.wasm.unityweb",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "Ericetto",
  productName: "Ragdoll Archers",
  productVersion: "0.1",
};


    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }
    
    loadingCover.style.display = "";

    const unityLoader = document.createElement("script");
    unityLoader.src = loaderUrl;
    unityLoader.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        loadingCover.style.display = "none";
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(unityLoader);

    document.addEventListener("pointerdown", () => {
      container.focus();
      window.focus();
      canvas.focus();
    });

  </script>
</body>
</html>
