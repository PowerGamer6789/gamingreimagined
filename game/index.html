<!DOCTYPE html>
<html lang="en" data-bs-theme="kazwire">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Game</title>
  <link rel="stylesheet" href="/themes.css">
  <link rel="icon" href="/favicon.ico">
</head>

<body>
  <div id="loginStatus"></div>
  <header>
    <img src="/logo_navbar.png" alt="Logo">
    <nav>
      <a href="/">Home</a>
      <a href="/games">Games</a>
      <a href="/credits">Credits</a>
    </nav>
  </header>

  <div class="container">
    <div class="game-box">
      <iframe id="gameframe" allowfullscreen allow="pointer-lock" sandbox="allow-scripts allow-same-origin allow-pointer-lock"></iframe>
      <div class="game-title" id="gameTitle"></div>
      <div class="game-author" id="gameAuthor"></div>
      <a class="close-btn" onclick="closeGame()">X</a>
      <a class="full-btn" onclick="toggleFullscreen(document.getElementById('gameframe'))"></a>
    </div>

    <div class="ads" id="adsArea"></div>
  </div>

  <script src="/ads/ads.js"></script>

  <script>
    /* ================= GAME DATA ================= */
    const games = {
      1: "UNDERTALE",
      2: "Escape Road",
      3: "OvO",
      4: "Five Nights at Freddy's",
      5: "Subway Surfers",
      6: "There is No Game",
      7: "Eggy Car",
      8: "Bloxorz",
      9: "Crossy Road",
      10: "Bad Time Simulator",
      11: "Geometry Dash",
      12: "Drift Boss",
      13: "Five Nights at Freddy's",
      14: "Five Nights at Freddy's 2",
      15: "Five Nights at Freddy's 3",
      16: "Five Nights at Freddy's 4",
      17: "Ragdoll Archers",
      18: "Retro Bowl",
      19: "Five Nights at Epstein's",
      20: "pwRChess",
      21: "Ragdoll Hit",
      22: "The i-Ready Collection",
      23: "Epstein's Basics",
      24: "Baldi's Basics Remastered",
      25: "Cookie Clicker",
      26: "Crazy Cattle 3D",
      27: "UNDERTALE Yellow",
      28: "Super Mario 64"
    };

    const authors = {
      1: "Toby Fox",
      2: "1games.io",
      3: "Dedra Games",
      4: "Scott Cawthon",
      5: "SYBO Games",
      6: "Kamizoto",
      7: "Beedo Games",
      8: "Damien Clark",
      9: "Hipster Whale",
      10: "Joe Zeng",
      11: "RobTop Games",
      12: "MarketJS",
      13: "Scott Cawthon",
      14: "Scott Cawthon",
      15: "Scott Cawthon",
      16: "Scott Cawthon",
      17: "Ericetto",
      18: "New Star Games",
      19: "Evan Productions",
      20: "pwR",
      21: "Ericetto",
      22: "Curriculum Associates",
      23: "BubbleFan",
      24: "Basically Games",
      25: "DashNet",
      26: "Anna Mayberry",
      27: "Team UNDERTALE Yellow",
      28: "Nintendo"
    };

    // IDs that need special iframe paths
    const hardcodedFrames = {
      13: "/frame/game/fnaf1/",
      14: "/frame/game/fnaf2/",
      15: "/frame/game/fnaf3/",
      16: "/frame/game/fnaf4/",
      19: "/frame/game/fnae/",
      22: "/frame/game/iready/",
    };

    // get ?id from URL
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    let title = games[id];
    let author = authors[id];

    if (!title) {
      title = "Invalid";
      author = "pwR";
      gameframe.src = "/frame/game/closed";
    } else if (hardcodedFrames[id]) {
      gameframe.src = hardcodedFrames[id];
    } else {
      const cleanSrc = title.toLowerCase().replace(/[^a-z0-9]/g, '');
      gameframe.src = `/frame/game/${cleanSrc}/`;
    }

    // set titles and author
    document.getElementById("pageTitle").textContent = title;
    document.getElementById("gameTitle").textContent = title;
    document.getElementById("gameAuthor").textContent = `By ${author}`;

    /* ================= FULLSCREEN ================= */
    function toggleFullscreen(elem) {
      if (!document.fullscreenElement) elem.requestFullscreen();
      else document.exitFullscreen();

      document.addEventListener("fullscreenchange", () => {
        elem.style.borderRadius = document.fullscreenElement ? "0" : "10px";
      });
    }

    /* ================= CLOSE ================= */
    function closeGame() {
      document.getElementById("gameframe").src = "/frame/game/closed";
    }

    /* ================= ADS ================= */
    const adsArea = document.getElementById('adsArea');
    let adIndex = 0;

    function rotateAd() {
      if (!ads || ads.length === 0) return;

      const ad = ads[adIndex];
      adsArea.innerHTML = '';

      const slot = document.createElement('div');
      slot.className = 'ad-slot';

      const img = document.createElement('img');
      img.src = ad.img;

      if (ad.href) {
        const link = document.createElement('a');
        link.href = ad.href;
        link.appendChild(img);
        slot.appendChild(link);
      } else {
        slot.appendChild(img);
      }

      adsArea.appendChild(slot);
      adIndex = (adIndex + 1) % ads.length;
    }

    rotateAd();
    setInterval(rotateAd, 10000);
  </script>

  <script type="module" defer src="/creds.js"></script>
</body>

</html>
