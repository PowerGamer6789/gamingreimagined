<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drift Boss Save Manager</title>
    <style>
        :root {
            --primary: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #f4f7f6;
            --card: #ffffff;
            --text: #2c3e50;
            --border: #dcdde1;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .manager-card {
            background-color: var(--card);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 350px;
            border: 1px solid var(--border);
        }

        h2 { 
            margin: 0 0 1.5rem 0; 
            font-weight: 600;
            text-align: center;
            color: var(--text);
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.6rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 2px solid var(--border);
            background: #fff;
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover { 
            background-color: #2980b9;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }

        #status {
            margin-top: 1.2rem;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            min-height: 1.2rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .status-success { color: var(--success); }
        .status-error { color: var(--error); }
        
        .visible { 
            opacity: 1 !important; 
            animation: pulse 0.3s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="manager-card">
        <h2>Drift Boss Save Manager</h2>
        
        <div class="input-group">
            <label for="coinInput">Collected Coins</label>
            <input type="number" id="coinInput" placeholder="Loading...">
        </div>

        <button id="saveBtn">Save Changes</button>

        <p id="status"></p>
    </div>

    <script>
        const STORAGE_KEY = 'mjs-drift-boss-game-v1.0.1-dailyreward';
        const coinInput = document.getElementById('coinInput');
        const saveBtn = document.getElementById('saveBtn');
        const statusMsg = document.getElementById('status');

        // Function to load the initial value from LocalStorage
        function init() {
            const rawData = localStorage.getItem(STORAGE_KEY);
            if (rawData) {
                try {
                    const data = JSON.parse(rawData);
                    if (data.collectedCoin !== undefined) {
                        coinInput.value = data.collectedCoin;
                    }
                } catch (e) {
                    showStatus("Error reading existing save", "error");
                }
            } else {
                showStatus("No save file found in storage", "error");
                coinInput.value = 0; // Default fallback
            }
        }

        function showStatus(text, type) {
            statusMsg.textContent = text;
            statusMsg.className = type === 'success' ? 'status-success' : 'status-error';
            statusMsg.classList.add('visible');
            
            setTimeout(() => {
                statusMsg.classList.remove('visible');
            }, 3000);
        }

        saveBtn.addEventListener('click', () => {
            const rawData = localStorage.getItem(STORAGE_KEY);
            
            if (!rawData) {
                showStatus("Error: Save file not found!", "error");
                return;
            }

            try {
                const data = JSON.parse(rawData);
                data.collectedCoin = parseInt(coinInput.value);
                
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                showStatus("Save file updated!", "success");
            } catch (e) {
                showStatus("Error: Invalid data format", "error");
            }
        });

        // Run on load
        init();
    </script>

</body>
</html>
